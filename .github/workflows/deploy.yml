name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node SENZA cache npm per evitare l'errore "lock file not found"
      # Se in futuro committi il package-lock.json, puoi rimettere: cache: 'npm'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Usa 'npm install' invece di 'npm ci' per tollerare l'assenza di package-lock.json
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
