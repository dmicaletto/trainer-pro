name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install --no-package-lock

      - name: Install Capacitor (Fallback)
        run: |
          npm install @capacitor/core
          npm install -D @capacitor/cli @capacitor/android

      - name: Build Web App
        run: npm run build

      - name: Initialize Capacitor
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Gym App" "com.gymapp.tracker" --web-dir dist --bundledWebRuntime false
          fi

      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        # Aggiunto --no-daemon e --stacktrace per stabilità e debug
        # Aggiunto 'clean' per evitare cache corrotte
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
