name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Java 21 per compatibilità con le ultime versioni di Android/Gradle
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Ensure Capacitor CLI
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web App
        run: npm run build

      - name: Init Capacitor (if needed)
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init NutriAI com.dmicaletto.trainerpro --web-dir dist
          fi

      - name: Add/Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      # --- FIX PER ERRORI DUPLICATE CLASSES (Versione Aggressiva) ---
      # Questo step inietta regole nel build.gradle per impedire il download
      # delle vecchie librerie jdk7/jdk8 che ora sono incluse nella stdlib.
      - name: Apply Kotlin Duplicate Classes Fix
        run: |
          cd android
          # Aggiunge configurazione per gestire i conflitti di versione
          echo "" >> build.gradle
          echo "configurations.all {" >> build.gradle
          echo "    resolutionStrategy.eachDependency { details ->" >> build.gradle
          echo "        if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {" >> build.gradle
          echo "            details.useVersion '1.8.22'" >> build.gradle
          echo "        }" >> build.gradle
          echo "    }" >> build.gradle
          echo "}" >> build.gradle
          
          # Modifica il file app/build.gradle per escludere esplicitamente i moduli duplicati
          # Nota: Questo comando usa sed per inserire le esclusioni nel blocco dependencies se esiste,
          # oppure le aggiunge alla fine se è più sicuro.
          # Qui usiamo un approccio che modifica le capabilities per risolvere il conflitto
          echo "" >> app/build.gradle
          echo "dependencies {" >> app/build.gradle
          echo "    modules {" >> app/build.gradle
          echo "        module(\"org.jetbrains.kotlin:kotlin-stdlib-jdk7\") {" >> app/build.gradle
          echo "            replacedBy(\"org.jetbrains.kotlin:kotlin-stdlib\", \"kotlin-stdlib-jdk7 is now part of kotlin-stdlib\")" >> app/build.gradle
          echo "        }" >> app/build.gradle
          echo "        module(\"org.jetbrains.kotlin:kotlin-stdlib-jdk8\") {" >> app/build.gradle
          echo "            replacedBy(\"org.jetbrains.kotlin:kotlin-stdlib\", \"kotlin-stdlib-jdk8 is now part of kotlin-stdlib\")" >> app/build.gradle
          echo "        }" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "}" >> app/build.gradle

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✅ google-services.json creato."
          else
            echo "⚠️ Segreto mancante. Creazione dummy file."
            echo '{"project_info":{"project_number":"000000000000","project_id":"dummy","storage_bucket":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:000000000000","android_client_info":{"package_name":"com.dmicaletto.trainerpro"}},"api_key":[{"current_key":"dummy"}]}]}' > android/app/google-services.json
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrainerPro-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
